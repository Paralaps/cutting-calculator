<svg xmlns="http://www.w3.org/2000/svg" viewBox="-417 -304 691 741" width="360" height="386" role="img" aria-label="Загрузка">
  <title>Загрузка</title>
  <style>
/* Постоянное движение механизма: linear, бесконечно. CSS-анимация
   продолжает идти вне main thread, пока страница занята загрузкой. */
.spin { transform-box: fill-box; transform-origin: center;
        animation: kolykhanka-turn linear infinite; }
.big { animation-duration: 4.6s; }
.small { animation-duration: 2.3s; animation-direction: reverse; }
@keyframes kolykhanka-turn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spin { animation: none; }
  #kolykhanka-loader { animation: kolykhanka-breathe 1.8s ease-in-out infinite; }
}
@keyframes kolykhanka-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  </style>
